schema_version: 1

context:
  name: pygmailsorter
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

build:
  number: 2
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - gmailsorter >=0.1

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Assign labels to emails in Google Mail based on their similarity to other emails assigned to the same label.
  license: BSD-3-Clause
  license_file:
    - LICENSE
  homepage: https://github.com/jan-janssen/gmailsorter

extra:
  recipe-maintainers:
    - jan-janssen
